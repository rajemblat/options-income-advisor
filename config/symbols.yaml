# Watchlist del usuario (2026-08-05): las empresas que robert sigue todo el tiempo en su
# plataforma. El robot se enfoca SOLO en estas para buscar entradas y revisar cada día
# (scan_full_universe: false en settings.yaml). Achica la búsqueda, la hace más rápida y la
# alinea con lo que realmente opera. Editar acá no requiere tocar código.
#
# Excluidos a propósito: SOLO los futuros (/MBT, /ES, /CL, /GC, etc.) — el robot no opera futuros.
# Los ÍNDICES SÍ van (usuario 2026-08-05): $SPX, $NDX, $RUT, $VIX con prefijo $ (Schwab lo exige
# para traer la cadena del índice).
#
# Nota sobre los irons: el Iron Butterfly y el Iron Condor usan $SPX SIEMPRE (está fijo en su
# config, intraday_butterfly/intraday_condor.underlying), así que funcionan tengan o no a SPX en
# esta lista. Tenerlo acá además hace que el robot de PUTS también evalúe el índice (aunque por su
# tamaño casi siempre lo saltea por buying power).
#
# Nota: SQQQ, UVXY, TMF, BITI son ETF inversos/de volatilidad — están porque los seguís, pero
# vender puts sobre ellos es poco habitual (decaen). Decime si querés sacarlos.

symbols:
